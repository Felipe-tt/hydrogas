// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        jcenter()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }

    // Força versões corrigidas de dependências transitivas do próprio AGP
    // (empacotador/assinador de build), flagadas pelo Dependabot:
    // - org.bouncycastle:bcprov-jdk18on < 1.85 (crítico/alto)
    // - io.netty:netty-* <= 4.1.136.Final (crítico/alto/médio)
    // Essas libs rodam só durante o build (assinatura do APK, compilador),
    // não vão para o APK publicado. Não testado via Gradle real aqui
    // (sem acesso de rede ao Maven do Google neste ambiente) — rode
    // `./gradlew :app:dependencies --configuration releaseRuntimeClasspath`
    // e um `assembleDebug` antes de publicar, pra confirmar que resolve
    // e que nada quebrou.
    configurations.classpath {
        resolutionStrategy {
            force 'org.bouncycastle:bcprov-jdk18on:1.85'
            force 'io.netty:netty-handler:4.1.137.Final'
            force 'io.netty:netty-codec-http:4.1.137.Final'
            force 'io.netty:netty-codec-http2:4.1.137.Final'
            force 'io.netty:netty-codec:4.1.137.Final'
        }
    }
}

allprojects {
    repositories {
        google()
        jcenter()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
