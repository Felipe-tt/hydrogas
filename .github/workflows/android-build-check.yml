name: Android build check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assembleDebug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Resolve dependencies and assemble debug APK
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
      - name: On failure, publish error tail as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 60000 build.log > tail.log
          gh issue create --title "android-build-check falhou (run ${{ github.run_id }})" --body-file tail.log
      - name: Submit dependency graph (pra Dependabot ver as versões forçadas)
        if: success()
        uses: gradle/actions/dependency-submission@v4
